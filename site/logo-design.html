<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1024px;height:1024px;overflow:hidden;font-family:Pretendard,"Apple SD Gothic Neo",sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#2d2b55 100%);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.g{position:absolute;border-radius:50%;filter:blur(110px)}
.g1{width:620px;height:620px;top:-220px;right:-160px;background:rgba(91,94,244,.55)}
.g2{width:520px;height:520px;bottom:-240px;left:-160px;background:rgba(253,186,116,.32)}
.star{position:absolute;border-radius:50%;background:#fff}
.moon{font-size:460px;line-height:1;filter:drop-shadow(0 30px 60px rgba(0,0,0,.35));position:relative;top:-30px}
.t{font-size:112px;font-weight:900;letter-spacing:-3px;margin-top:-10px;text-shadow:0 6px 24px rgba(0,0,0,.25)}
.s{font-size:38px;font-weight:700;letter-spacing:12px;color:rgba(255,255,255,.55);margin-top:14px}
</style></head><body>
<div class="g g1"></div><div class="g g2"></div>
<div class="star" style="width:6px;height:6px;top:120px;left:160px;opacity:.6"></div>
<div class="star" style="width:4px;height:4px;top:200px;left:820px;opacity:.5"></div>
<div class="star" style="width:5px;height:5px;top:760px;left:120px;opacity:.4"></div>
<div class="star" style="width:4px;height:4px;top:880px;left:760px;opacity:.5"></div>
<div class="star" style="width:3px;height:3px;top:330px;left:90px;opacity:.5"></div>
<div class="star" style="width:3px;height:3px;top:640px;left:930px;opacity:.5"></div>
<div class="moon">🌙</div>
<div class="t">꿈해몽 사전</div>
<div class="s">DREAMDICT</div>
</body></html>
